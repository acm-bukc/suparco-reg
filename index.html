<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACM Student Chapter Registration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="registration-page">
    <section class="registration-card" aria-labelledby="page-title">
      <div class="card-accent" aria-hidden="true"></div>
      <div class="logo"><img src="acmlogo-transparent.png" alt="ACM logo"></div>
      <p class="organization">Bahria University Karachi</p>
      <h1 id="page-title">Student Registration</h1>
      <p class="intro">Reserve your place for the industrial visit at SUPARCO.</p>
      <div class="availability" id="registrationStatus"><span class="status-dot"></span><strong>Checking availability...</strong></div>
      <p class="registration-count" id="registrationCount" aria-live="polite">Loading registered students...</p>

  </main>
  <script src="script.js"></script>
</body>
</html>
